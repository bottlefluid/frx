<!doctype html>
<!-- Screen & window picker for Frixion Desktop: shown by main.js when the website calls getDisplayMedia().
     All names are set with textContent, and images only accept data:image/ URLs from Electron's desktopCapturer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Share your screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    height: 100%; overflow: hidden; background: #1e1f22; color: #f2f3f5;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 14px;
  }
  body { display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,.08); }
  .head {
    display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px;
    background: #232428; border-bottom: 1px solid rgba(255,255,255,.07);
    -webkit-app-region: drag;
  }
  .head-title { font-size: 16px; font-weight: 700; flex: 1; }
  .head-acts { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
  .ic-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid transparent;
    background: transparent; color: #b5bac1; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ic-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
  .tabs {
    display: flex; align-items: center; gap: 6px; padding: 10px 16px 0;
    background: #232428; border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .tab {
    border: none; background: transparent; color: #949ba4; font: inherit;
    font-size: 13.5px; font-weight: 600; padding: 8px 12px 10px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: #dbdee1; }
  .tab.on { color: #fff; border-bottom-color: #5865f2; }
  .tab-search {
    margin-left: auto; margin-bottom: 6px; width: 190px; height: 28px; padding: 0 10px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,.1); background: #1e1f22;
    color: #f2f3f5; font: inherit; font-size: 12.5px; outline: none; user-select: text;
  }
  .tab-search:focus { border-color: #5865f2; }
  .tab-search::placeholder { color: #6d6f78; }
  .body {
    flex: 1; overflow-y: auto; padding: 14px 16px; background: #2b2d31;
  }
  .body::-webkit-scrollbar { width: 8px; }
  .body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
  .grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
  }
  .card {
    display: flex; flex-direction: column; gap: 8px; padding: 8px;
    border-radius: 10px; background: #1e1f22; border: 2px solid rgba(255,255,255,.07);
    color: inherit; text-align: left; cursor: pointer; font: inherit;
    transition: border-color .12s ease, background .12s ease;
  }
  .card:hover { border-color: rgba(255,255,255,.22); background: #232428; }
  .card.sel { border-color: #5865f2; background: rgba(88,101,242,.14); }
  .thumb-wrap {
    position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px;
    overflow: hidden; background: #111214; display: flex; align-items: center; justify-content: center;
  }
  .thumb { width: 100%; height: 100%; object-fit: contain; display: block; }
  .badge {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
    background: #5865f2; color: #fff; display: none; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .card.sel .badge { display: flex; }
  .meta { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 0 2px; }
  .app-ic { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; object-fit: contain; }
  .name {
    font-size: 13px; font-weight: 600; color: #f2f3f5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
  }
  .empty {
    height: 100%; min-height: 220px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; text-align: center;
    color: #949ba4; padding: 20px;
  }
  .empty strong { color: #f2f3f5; font-size: 14.5px; }
  .empty p { font-size: 13px; max-width: 420px; line-height: 1.45; }
  .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; background: #232428; border-top: 1px solid rgba(255,255,255,.07);
  }
  .hint { font-size: 12.5px; color: #949ba4; }
  .foot-acts { display: flex; align-items: center; gap: 8px; }
  .btn {
    height: 34px; padding: 0 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,.12);
    background: #313338; color: #f2f3f5; font: inherit; font-size: 13.5px; font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #3f4147; }
  .btn-primary { background: #5865f2; border-color: #5865f2; color: #fff; }
  .btn-primary:hover { background: #4752c4; border-color: #4752c4; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  @media (max-width: 540px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="head">
    <div class="head-title">Choose what to share</div>
    <div class="head-acts">
      <button type="button" class="ic-btn" id="refresh-btn" title="Refresh list" aria-label="Refresh list">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button type="button" class="ic-btn" id="close-btn" title="Cancel" aria-label="Cancel">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" class="tab on" id="tab-window" role="tab" aria-selected="true">Windows</button>
    <button type="button" class="tab" id="tab-screen" role="tab" aria-selected="false">Entire Screens</button>
    <input type="search" class="tab-search" id="search-box" placeholder="Search windows...">
  </div>
  <div class="body" id="body">
    <div class="empty"><strong>Loading screens and windows...</strong></div>
  </div>
  <div class="foot">
    <span class="hint">Video only (silent) · Double-click to share right away</span>
    <div class="foot-acts">
      <button type="button" class="btn" id="cancel-btn">Cancel</button>
      <button type="button" class="btn btn-primary" id="share-btn" disabled>Share</button>
    </div>
  </div>
<script>
  const body = document.getElementById('body');
  const tabScreen = document.getElementById('tab-screen');
  const tabWindow = document.getElementById('tab-window');
  const shareBtn = document.getElementById('share-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const closeBtn = document.getElementById('close-btn');
  const refreshBtn = document.getElementById('refresh-btn');

  const searchBox = document.getElementById('search-box');

  let state = { sources: [], denied: false, loading: true };
  let activeTab = 'window';
  let selectedId = '';
  let query = '';

  const isDataImg = u => typeof u === 'string' && /^data:image\/(png|jpe?g|webp);base64,/i.test(u);

  function filtered() {
    const q = query.trim().toLowerCase();
    return state.sources.filter(s => s.kind === activeTab && (!q || String(s.name || '').toLowerCase().includes(q)));
  }

  function render() {
    const screens = state.sources.filter(s => s.kind === 'screen');
    const windows = state.sources.filter(s => s.kind === 'window');
    tabWindow.textContent = windows.length ? `Windows (${windows.length})` : 'Windows';
    tabScreen.textContent = screens.length ? `Entire Screens (${screens.length})` : 'Entire Screens';
    tabWindow.classList.toggle('on', activeTab === 'window');
    tabScreen.classList.toggle('on', activeTab === 'screen');
    tabWindow.setAttribute('aria-selected', String(activeTab === 'window'));
    tabScreen.setAttribute('aria-selected', String(activeTab === 'screen'));
    searchBox.placeholder = activeTab === 'window' ? 'Search windows...' : 'Search screens...';

    body.textContent = '';
    if (state.loading) {
      const box = document.createElement('div');
      box.className = 'empty';
      const st = document.createElement('strong');
      st.textContent = 'Loading screens and windows...';
      box.append(st);
      body.append(box);
      shareBtn.disabled = true;
      return;
    }
    if (state.denied) {
      const box = document.createElement('div');
      box.className = 'empty';
      const st = document.createElement('strong');
      st.textContent = 'Screen recording permission is off';
      const p = document.createElement('p');
      p.textContent = 'Allow Frixion under System Settings > Privacy & Security > Screen Recording, then reopen Frixion.';
      box.append(st, p);
      body.append(box);
      shareBtn.disabled = true;
      return;
    }

    const list = filtered();
    if (!list.length) {
      const box = document.createElement('div');
      box.className = 'empty';
      const st = document.createElement('strong');
      st.textContent = activeTab === 'screen' ? 'No screens found' : 'No open windows found';
      const p = document.createElement('p');
      p.textContent = 'Try switching tabs or clicking Refresh.';
      box.append(st, p);
      body.append(box);
      selectedId = '';
      shareBtn.disabled = true;
      return;
    }

    if (!list.some(s => s.id === selectedId)) selectedId = list[0].id;
    shareBtn.disabled = !selectedId;

    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(s => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'card' + (s.id === selectedId ? ' sel' : '');
      btn.dataset.id = s.id;

      const wrap = document.createElement('div');
      wrap.className = 'thumb-wrap';
      if (isDataImg(s.thumb)) {
        const img = document.createElement('img');
        img.className = 'thumb';
        img.alt = '';
        img.src = s.thumb;
        wrap.append(img);
      }
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
      wrap.append(badge);

      const meta = document.createElement('div');
      meta.className = 'meta';
      if (isDataImg(s.icon)) {
        const ic = document.createElement('img');
        ic.className = 'app-ic';
        ic.alt = '';
        ic.src = s.icon;
        meta.append(ic);
      }
      const nm = document.createElement('span');
      nm.className = 'name';
      nm.textContent = s.name || (s.kind === 'screen' ? 'Screen' : 'Window');
      nm.title = nm.textContent;
      meta.append(nm);

      btn.append(wrap, meta);
      btn.addEventListener('click', () => {
        selectedId = s.id;
        shareBtn.disabled = false;
        grid.querySelectorAll('.card').forEach(el => el.classList.toggle('sel', el.dataset.id === selectedId));
      });
      btn.addEventListener('dblclick', () => {
        selectedId = s.id;
        window.frxPicker.choose(selectedId);
      });
      grid.append(btn);
    });
    body.append(grid);
  }

  tabWindow.addEventListener('click', () => { activeTab = 'window'; render(); });
  tabScreen.addEventListener('click', () => { activeTab = 'screen'; render(); });
  searchBox.addEventListener('input', () => { query = searchBox.value; render(); });
  shareBtn.addEventListener('click', () => { if (selectedId) window.frxPicker.choose(selectedId); });
  cancelBtn.addEventListener('click', () => window.frxPicker.cancel());
  closeBtn.addEventListener('click', () => window.frxPicker.cancel());
  refreshBtn.addEventListener('click', () => {
    state = { ...state, loading: true };
    render();
    window.frxPicker.refresh();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); window.frxPicker.cancel(); }
    else if (e.key === 'Enter' && selectedId && !state.loading) { e.preventDefault(); window.frxPicker.choose(selectedId); }
  });

  if (window.frxPicker) {
    window.frxPicker.onSources(data => {
      state = {
        sources: Array.isArray(data.sources) ? data.sources : [],
        denied: !!data.denied,
        loading: !!data.loading,
      };
      if (!state.loading && activeTab === 'window' && !state.sources.some(s => s.kind === 'window') && state.sources.some(s => s.kind === 'screen')) {
        activeTab = 'screen';
      }
      render();
    });
  }
</script>
</body>
</html>
