# Builds the Frixion app for Windows, Mac and Linux.
# To make installers: push a tag like v1.0.0 (or press "Run workflow" on the Actions tab). The installers are attached to the
# release for that tag, and are also available as downloads on the workflow run.
name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Use the tag as the app version (v1.0.1 becomes 1.0.1)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      # On a tag: build and upload the installers and update files to that release. Otherwise just build (a test run).
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false    # no code-signing certificate (see README)
      - name: Build (test run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: frixion-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
