<!doctype html>
<!-- Notifications over games: shown by main.js in a small see-through, click-through window in the corner of the screen.
     Text is only ever set with textContent, and pictures only load from https: or data:image. -->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  #stack { position: fixed; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .card {
    width: 340px; box-sizing: border-box; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(17,18,20,.94); color: #f2f3f5;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: in .22s cubic-bezier(.2,.9,.3,1.1);
  }
  img { flex: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #5865f2; }
  .copy { min-width: 0; flex: 1; }
  .t { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b { margin-top: 2px; font-size: 13.5px; line-height: 1.35; color: #dbdee1; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .h { margin-top: 6px; font-size: 11.5px; color: #949ba4; }
  @keyframes in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="stack"></div>
<script>
  const stack = document.getElementById('stack');
  window.frxPopup.onCards(cards => {
    const want = new Set(cards.map(c => String(c.id)));
    [...stack.children].forEach(el => { if (!want.has(el.dataset.id)) el.remove(); });
    cards.forEach(c => {
      if ([...stack.children].some(el => el.dataset.id === String(c.id))) return;
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.id = String(c.id);
      const img = document.createElement('img');
      img.alt = '';
      if (/^(https:|data:image\/)/i.test(c.icon || '')) img.src = c.icon;
      const copy = document.createElement('div');
      copy.className = 'copy';
      const t = document.createElement('div'); t.className = 't'; t.textContent = c.title || 'Frixion';
      const b = document.createElement('div'); b.className = 'b'; b.textContent = c.body || '';
      copy.append(t, b);
      if (c.hint) { const h = document.createElement('div'); h.className = 'h'; h.textContent = c.hint; copy.append(h); }
      el.append(img, copy);
      stack.appendChild(el);
    });
  });
</script>
</body>
</html>
